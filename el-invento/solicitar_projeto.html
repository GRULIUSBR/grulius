<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitaçao De Projeto</title>  
    <link rel="stylesheet" href="projetos.css">
</head>
</head>
<div class="text">
    <h1>Solicitaçao De Projeto</h1>
    <br></div>
<body>
    <h2>Preencha o formulario para <br> a Solicitaçao do Projeto</h2>
    <h4>(*)obrigatorio</h4>
    

    <form>
        <div class="container-formulario">

        </div>
        <div class="item">
         <label>*EMPRESA:</label>
            <br>
            <input type="text">
            <br><br>
        </div>
        <div class="item">
            <label>*RESPONSAVEL:</label>
            <br>
            <input type="text">
            <br><br>
        </div>
        <div class="item">
            <label>*EMAIL DE CONTATO:</label>
            <br>
            <input type="text">
            <br><br>
        </div> 
        <div class="item">

            <label>*TELEFONE:</label>
            <br>
            <input type="number">
            <br>
            <br>
        </div>    
        <div class="item">
            <label>*NOME DO PROJETO:</label>
            <br>
            <input type="text" placeholder="">
            <br><br>
        </div>
        

        </div>

        <div class="descricao"></div>
            <label>*DESCRIÇÃO DO PROJETO:</label>
            <br>    
            
            <textarea name="descricao" id="descricao" placeholder="Digite a Descriçao Aqui..."></textarea>
        </div>
        <div class="boton">
            <button>Enviar Solicitaçao</button>
        </div>
    </form>
</body>

















</html>
