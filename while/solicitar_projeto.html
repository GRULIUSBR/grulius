<body>
    <main>
        <section>
            <div class="text">
                <h1>Solicitaçao De Projeto</h1>
                <h2>Preencha o formulario para <br> a Solicitaçao do Projeto</h2>
                <h4>(*)obrigatorio</h4>
            </div>
            <div class="form">
                <form>
                    <label for="nome">Nome Completo*</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">Telefone*</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="projeto">Tipo de Projeto*</label>
                    <select id="projeto" name="projeto" required>
                        <option value="">Selecione</option>
                        <option value="web">Desenvolvimento Web</option>
                        <option value="mobile">Aplicativo Mobile</option>
                        <option value="software">Software Personalizado</option>
                        <option value="outro">Outro</option>
                    </select>

                    <label for="descricao">Descrição do Projeto*</label>
                    <textarea id="descricao" name="descricao" rows="4" required></textarea>

                    <button type="submit">Enviar Solicitação</button>
                </form>
            </div>
        </section>
    </main>


</body>
